<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Meta and CSS includes -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Guests - HotelAir</title>
		<link rel="icon" type="image/png" href="favicon.png" />
	</head>
	<body>
		<div>
			<!-- Sidebar Navigation -->
			<nav>
				<!-- Logo and Brand -->
				<div>
					<svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="hotelair-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
								<stop stop-color="#1976d2" />
								<stop offset="1" stop-color="#00bcd4" />
							</linearGradient>
						</defs>
						<rect x="2" y="10" width="28" height="16" rx="4" fill="url(#hotelair-gradient)"/>
						<rect x="8" y="6" width="16" height="6" rx="2" fill="#fff" fill-opacity=".9"/>
						<circle cx="10" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
						<circle cx="22" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
					</svg>
					HotelAir
				</div>
				<!-- Sidebar Links -->
				<ul>
					<li><a href="dashboard.html">Dashboard</a></li>
					<li><a href="rooms.html">Rooms</a></li>
					<li><a href="bookings.html">Bookings</a></li>
					<li><a href="calendar.html">Calendar</a></li>
					<li><a href="guests.html" class="active">Guests</a></li>
					<li><a href="staff.html">Staff</a></li>
					<li><a href="payments.html">Payments</a></li>
					<li><a href="settings.html">Settings</a></li>
					<li><a href="about.html">About Us</a></li>
				</ul>
			</nav>

			<div>
				<!-- Header Bar -->
				<header>
					<div>
						<span>Guest Directory</span>
						<div>
							<button id="darkModeToggle" title="Toggle dark mode"><i class="bi bi-moon-fill"></i></button>
							<button id="logoutBtn">Logout</button>
							<button data-bs-toggle="modal" data-bs-target="#guestModal">Add Guest</button>
						</div>
					</div>
				</header>

				<main>
					<!-- Loading Spinner -->
					<div id="loadingSpinner" style="display:none;">
						<div>Loading...</div>
					</div>
					<!-- Toast Container for notifications -->
					<div id="toastContainer"></div>
					<!-- Guests Table -->
					<div>
						<table id="guestsTable">
							<thead>
								<tr>
									<th>#</th>
									<th>Name</th>
									<th>Email</th>
									<th>Phone</th>
									<th>Country</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</main>
			</div>
		</div>

		<!-- Guest Modal -->
		<div id="guestModal" tabindex="-1" aria-hidden="true">
			<div>
				<form id="guestForm">
					<div>
						<h5>Guest Form</h5>
						<button type="button" data-bs-dismiss="modal">Close</button>
					</div>
					<div>
						<input type="hidden" id="guestId" />
						<div>
							<label>Full Name</label>
							<input type="text" id="guestName" required aria-describedby="guestNameError" />
							<div id="guestNameError"></div>
						</div>
						<div>
							<label>Email</label>
							<input type="email" id="guestEmail" required aria-describedby="guestEmailError" />
							<div id="guestEmailError"></div>
						</div>
						<div>
							<label>Phone</label>
							<input type="tel" id="guestPhone" required aria-describedby="guestPhoneError" />
							<div id="guestPhoneError"></div>
						</div>
						<div>
							<label>Country</label>
							<textarea id="guestAddress" rows="2" aria-describedby="guestAddressError"></textarea>
							<div id="guestAddressError"></div>
						</div>
					</div>
					<div>
						<button type="submit">Save</button>
						<button type="button" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
		</div>

		<script src="js/storage-utils.js"></script>
		<script src="js/guests.js"></script>
	</body>
</html>
