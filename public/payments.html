<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Payments - HotelAir</title>
		<link rel="icon" type="image/png" href="favicon.png" />
	</head>
	<body>
		<div>
			<!-- Sidebar Navigation -->
			<nav>
				<!-- Logo and Brand -->
				<div>
					<svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="hotelair-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
								<stop stop-color="#1976d2" />
								<stop offset="1" stop-color="#00bcd4" />
							</linearGradient>
						</defs>
						<rect x="2" y="10" width="28" height="16" rx="4" fill="url(#hotelair-gradient)"/>
						<rect x="8" y="6" width="16" height="6" rx="2" fill="#fff" fill-opacity=".9"/>
						<circle cx="10" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
						<circle cx="22" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
					</svg>
					HotelAir
				</div>
				<!-- Sidebar Links -->
				<ul>
					<li><a href="dashboard.html">Dashboard</a></li>
					<li><a href="rooms.html">Rooms</a></li>
					<li><a href="bookings.html">Bookings</a></li>
					<li><a href="calendar.html">Calendar</a></li>
					<li><a href="guests.html">Guests</a></li>
					<li><a href="staff.html">Staff</a></li>
					<li><a href="payments.html" class="active">Payments</a></li>
					<li><a href="settings.html">Settings</a></li>
					<li><a href="about.html">About Us</a></li>
				</ul>
			</nav>

			<div>
				<!-- Header Bar -->
				<header>
					<div>
						<span>Payment History</span>
						<div>
							<button id="darkModeToggle" title="Toggle dark mode"><i class="bi bi-moon-fill"></i></button>
							<button id="logoutBtn">Logout</button>
							<button data-bs-toggle="modal" data-bs-target="#paymentModal">Add Payment</button>
						</div>
					</div>
				</header>

				<main>
					<!-- Payments Table -->
					<div>
						<table id="paymentsTable">
							<thead>
								<tr>
									<th>#</th>
									<th>Guest</th>
									<th>Amount</th>
									<th>Date</th>
									<th>Method</th>
									<th>Note</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
					<!-- Payments Chart Row -->
					<div id="paymentsChartsRow">
						<div>
							<h6>Payments by Method</h6>
							<canvas id="paymentChart" height="120"></canvas>
						</div>
					</div>
				</main>
			</div>
		</div>

		<!-- Payment Modal -->
		<div id="paymentModal" tabindex="-1" aria-hidden="true">
			<div>
				<form id="paymentForm">
					<div>
						<h5>Record Payment</h5>
						<button type="button" data-bs-dismiss="modal">Close</button>
					</div>
					<div>
						<input type="hidden" id="paymentId" />
						<div>
							<label>Guest Name</label>
							<input type="text" id="paymentGuest" required aria-describedby="paymentGuestError" />
							<div id="paymentGuestError"></div>
						</div>
						<div>
							<label>Amount ($)</label>
							<input type="number" id="paymentAmount" required aria-describedby="paymentAmountError" />
							<div id="paymentAmountError"></div>
						</div>
						<div>
							<label>Date</label>
							<input type="date" id="paymentDate" required aria-describedby="paymentDateError" />
							<div id="paymentDateError"></div>
						</div>
						<div>
							<label>Method</label>
							<select id="paymentMethod" aria-describedby="paymentMethodError">
								<option value="Cash">Cash</option>
								<option value="Credit Card">Credit Card</option>
								<option value="Online">Online</option>
								<option value="Bank Transfer">Bank Transfer</option>
							</select>
							<div id="paymentMethodError"></div>
						</div>
						<div>
							<label>Note</label>
							<textarea id="paymentNote" rows="2" aria-describedby="paymentNoteError"></textarea>
							<div id="paymentNoteError"></div>
						</div>
					</div>
					<div>
						<button type="submit">Save</button>
						<button type="button" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
		</div>

		<script src="js/storage-utils.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
		<script src="js/payments.js"></script>
	</body>
</html>
