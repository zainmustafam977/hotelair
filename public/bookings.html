<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Meta and CSS includes -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Bookings - HotelAir</title>
		<link rel="icon" type="image/png" href="favicon.png" />
	</head>
	<body>
		<div>
			<!-- Sidebar Navigation -->
			<nav>
				<!-- Logo and Brand -->
				<div>
					<svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="hotelair-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
								<stop stop-color="#1976d2" />
								<stop offset="1" stop-color="#00bcd4" />
							</linearGradient>
						</defs>
						<rect x="2" y="10" width="28" height="16" rx="4" fill="url(#hotelair-gradient)"/>
						<rect x="8" y="6" width="16" height="6" rx="2" fill="#fff" fill-opacity=".9"/>
						<circle cx="10" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
						<circle cx="22" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
					</svg>
					HotelAir
				</div>
				<!-- Sidebar Links -->
				<ul>
					<li><a href="dashboard.html">Dashboard</a></li>
					<li><a href="rooms.html">Rooms</a></li>
					<li><a href="bookings.html" class="active">Bookings</a></li>
					<li><a href="calendar.html">Calendar</a></li>
					<li><a href="guests.html">Guests</a></li>
					<li><a href="staff.html">Staff</a></li>
					<li><a href="payments.html">Payments</a></li>
					<li><a href="settings.html">Settings</a></li>
					<li><a href="about.html">About Us</a></li>
				</ul>
			</nav>
			<div>
				<!-- Header Bar -->
				<header>
					<div>
						<span>Booking Management</span>
						<div>
							<button id="darkModeToggle" title="Toggle dark mode"><i class="bi bi-moon-fill"></i></button>
							<button id="logoutBtn">Logout</button>
							<button data-bs-toggle="modal" data-bs-target="#bookingModal">Add Booking</button>
						</div>
					</div>
				</header>
				<main>
					<!-- Loading Spinner -->
					<div id="loadingSpinner" style="display:none;">
						<div>Loading...</div>
					</div>
					<!-- Filter Row and Summary inserted by JS -->
					<div>
						<table id="bookingsTable">
							<thead>
								<tr>
									<th>#</th>
									<th>Guest</th>
									<th>Room</th>
									<th>Check-in</th>
									<th>Check-out</th>
									<th>Status</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</main>
			</div>
		</div>

		<!-- Booking Modal -->
		<div id="bookingModal" tabindex="-1" aria-hidden="true">
			<div>
				<form id="bookingForm">
					<div>
						<h5>Booking Form</h5>
						<button type="button" data-bs-dismiss="modal">Close</button>
					</div>
					<div>
						<input type="hidden" id="bookingId" />
						<div>
							<label>Guest Name</label>
							<input type="text" id="guestName" required list="guestList" aria-describedby="guestNameError" />
							<div id="guestNameError"></div>
						</div>
						<div>
							<label>Room</label>
							<select id="roomSelect" aria-describedby="roomSelectError"></select>
							<div id="roomSelectError"></div>
						</div>
						<div>
							<label>Check-in</label>
							<input type="date" id="checkin" required aria-describedby="checkinError" />
							<div id="checkinError"></div>
						</div>
						<div>
							<label>Check-out</label>
							<input type="date" id="checkout" required aria-describedby="checkoutError" />
							<div id="checkoutError"></div>
						</div>
						<div>
							<label>Status</label>
							<select id="bookingStatus">
								<option value="confirmed">Confirmed</option>
								<option value="checked-in">Checked-in</option>
								<option value="checked-out">Checked-out</option>
								<option value="cancelled">Cancelled</option>
							</select>
						</div>
					</div>
					<div>
						<button type="submit">Save</button>
						<button type="button" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
		</div>
		<datalist id="guestList"></datalist>

		<script src="js/storage-utils.js"></script>
		<script src="js/bookings.js"></script>
	</body>
</html>
