<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Settings - HotelAir</title>
		<link rel="icon" type="image/png" href="favicon.png" />
	</head>
	<body>
		<div>
			<!-- Sidebar Navigation -->
			<nav>
				<!-- Logo and Brand -->
				<div>
					<svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="hotelair-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
								<stop stop-color="#1976d2" />
								<stop offset="1" stop-color="#00bcd4" />
							</linearGradient>
						</defs>
						<rect x="2" y="10" width="28" height="16" rx="4" fill="url(#hotelair-gradient)"/>
						<rect x="8" y="6" width="16" height="6" rx="2" fill="#fff" fill-opacity=".9"/>
						<circle cx="10" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
						<circle cx="22" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
					</svg>
					HotelAir
				</div>
				<!-- Sidebar Links -->
				<ul>
					<li><a href="dashboard.html">Dashboard</a></li>
					<li><a href="rooms.html">Rooms</a></li>
					<li><a href="bookings.html">Bookings</a></li>
					<li><a href="calendar.html">Calendar</a></li>
					<li><a href="guests.html">Guests</a></li>
					<li><a href="staff.html">Staff</a></li>
					<li><a href="payments.html">Payments</a></li>
					<li><a href="settings.html" class="active">Settings</a></li>
					<li><a href="about.html">About Us</a></li>
				</ul>
			</nav>

			<div>
				<!-- Header Bar -->
				<header>
					<div>
						<span>Settings</span>
						<div>
							<button id="darkModeToggle" title="Toggle dark mode"><i class="bi bi-moon-fill"></i></button>
							<button id="logoutBtn">Logout</button>
						</div>
					</div>
				</header>

				<main>
					<!-- Settings Tabs -->
					<ul id="settingsTabs">
						<li><button id="admin-tab" type="button" data-bs-target="#admin">Admin Profile</button></li>
						<li><button id="hotel-tab" type="button" data-bs-target="#hotel">Hotel Info</button></li>
					</ul>
					<div id="settingsContent">
						<div id="admin">
							<form id="adminForm">
								<div>
									<label>Admin Name</label>
									<input type="text" id="adminName" required title="Admin Name" placeholder="Enter admin name" aria-describedby="adminNameError" />
									<div id="adminNameError"></div>
								</div>
								<div>
									<label>Admin Email</label>
									<input type="email" id="adminEmail" required title="Admin Email" placeholder="Enter admin email" aria-describedby="adminEmailError" />
									<div id="adminEmailError"></div>
								</div>
								<div>
									<label>Role</label>
									<select id="adminRole" title="Admin Role" aria-describedby="adminRoleError">
										<option value="admin">Admin</option>
										<option value="manager">Manager</option>
									</select>
									<div id="adminRoleError"></div>
								</div>
								<div>
									<button type="submit">Save Admin</button>
								</div>
							</form>
						</div>
						<div id="hotel">
							<form id="hotelForm">
								<div>
									<label>Hotel Name</label>
									<input type="text" id="hotelName" required title="Hotel Name" placeholder="Enter hotel name" aria-describedby="hotelNameError" />
									<div id="hotelNameError"></div>
								</div>
								<div>
									<label>Phone</label>
									<input type="tel" id="hotelPhone" title="Hotel Phone" placeholder="Enter hotel phone" aria-describedby="hotelPhoneError" />
									<div id="hotelPhoneError"></div>
								</div>
								<div>
									<label>Email</label>
									<input type="email" id="hotelEmail" title="Hotel Email" placeholder="Enter hotel email" aria-describedby="hotelEmailError" />
									<div id="hotelEmailError"></div>
								</div>
								<div>
									<label>Logo URL</label>
									<input type="url" id="hotelLogo" title="Hotel Logo URL" placeholder="Enter logo URL" aria-describedby="hotelLogoError" />
									<div id="hotelLogoError"></div>
								</div>
								<div>
									<button type="submit">Save Hotel Info</button>
								</div>
							</form>
						</div>
					</div>

					<!-- Application Preferences Form -->
					<form id="prefsForm">
						<h5>Application Preferences</h5>
						<div>
							<label>Currency</label>
							<select id="currency" title="Currency">
								<option value="USD">USD</option>
								<option value="EUR">EUR</option>
								<option value="GBP">GBP</option>
								<option value="PKR">PKR</option>
							</select>
						</div>
						<div>
							<label>Timezone</label>
							<select id="timezone" title="Timezone">
								<option value="GMT-5">GMT-5</option>
								<option value="GMT+0">GMT+0</option>
								<option value="GMT+5">GMT+5</option>
								<option value="GMT+8">GMT+8</option>
							</select>
						</div>
						<div>
							<label>Date Format</label>
							<select id="dateFormat" title="Date Format">
								<option value="YYYY-MM-DD">YYYY-MM-DD</option>
								<option value="MM/DD/YYYY">MM/DD/YYYY</option>
								<option value="DD-MM-YYYY">DD-MM-YYYY</option>
							</select>
						</div>
						<div>
							<button type="submit">Save Preferences</button>
						</div>
					</form>

					<!-- User Preferences Form -->
					<form id="userPrefsForm">
						<h5>User Preferences</h5>
						<div>
							<label>Language</label>
							<select id="userLang" title="Language">
								<option value="en">English</option>
								<option value="ur">Urdu</option>
								<option value="ar">Arabic</option>
								<option value="fr">French</option>
							</select>
						</div>
						<div>
							<label>Notifications</label>
							<select id="userNotify" title="Notifications">
								<option value="all">All</option>
								<option value="important">Important Only</option>
								<option value="none">None</option>
							</select>
						</div>
						<div>
							<label>Custom Theme</label>
							<select id="userTheme" title="Custom Theme">
								<option value="default">Default</option>
								<option value="teal">Teal</option>
								<option value="blue">Blue</option>
								<option value="dark">Dark</option>
							</select>
						</div>
						<div>
							<button type="submit">Save User Preferences</button>
						</div>
					</form>
				</main>
			</div>
		</div>

		<script src="js/storage-utils.js"></script>
		<script src="js/settings.js"></script>
	</body>
</html>
