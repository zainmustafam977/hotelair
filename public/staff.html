<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Meta and CSS includes -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Staff Management - HotelAir</title>
		<link rel="icon" type="image/png" href="favicon.png" />
	</head>
	<body>
		<div>
			<!-- Sidebar Navigation -->
			<nav>
				<!-- Logo and Brand -->
				<div>
					<svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="hotelair-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
								<stop stop-color="#1976d2" />
								<stop offset="1" stop-color="#00bcd4" />
							</linearGradient>
						</defs>
						<rect x="2" y="10" width="28" height="16" rx="4" fill="url(#hotelair-gradient)"/>
						<rect x="8" y="6" width="16" height="6" rx="2" fill="#fff" fill-opacity=".9"/>
						<circle cx="10" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
						<circle cx="22" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
					</svg>
					HotelAir
				</div>
				<!-- Sidebar Links -->
				<ul>
					<li><a href="dashboard.html">Dashboard</a></li>
					<li><a href="rooms.html">Rooms</a></li>
					<li><a href="bookings.html">Bookings</a></li>
					<li><a href="calendar.html">Calendar</a></li>
					<li><a href="guests.html">Guests</a></li>
					<li><a href="staff.html" class="active">Staff</a></li>
					<li><a href="payments.html">Payments</a></li>
					<li><a href="settings.html">Settings</a></li>
					<li><a href="about.html">About Us</a></li>
				</ul>
			</nav>

			<div>
				<!-- Header Bar -->
				<header>
					<div>
						<span>Staff Management</span>
						<div>
							<button id="darkModeToggle" title="Toggle dark mode"><i class="bi bi-moon-fill"></i></button>
							<button id="logoutBtn">Logout</button>
							<button data-bs-toggle="modal" data-bs-target="#staffModal">Add Staff</button>
						</div>
					</div>
				</header>

				<main>
					<!-- Staff Table -->
					<div>
						<table id="staffTable">
							<thead>
								<tr>
									<th>#</th>
									<th>Name</th>
									<th>Role</th>
									<th>Email</th>
									<th>Phone</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</main>
			</div>
		</div>

		<!-- Staff Modal -->
		<div id="staffModal" tabindex="-1" aria-hidden="true">
			<div>
				<form id="staffForm">
					<div>
						<h5>Staff Form</h5>
						<button type="button" data-bs-dismiss="modal">Close</button>
					</div>
					<div>
						<input type="hidden" id="staffId" />
						<div>
							<label>Full Name</label>
							<input type="text" id="staffName" required aria-describedby="staffNameError" />
							<div id="staffNameError"></div>
						</div>
						<div>
							<label>Role</label>
							<select id="staffRole" required aria-describedby="staffRoleError">
								<option value="">Select Role</option>
								<option value="Manager">Manager</option>
								<option value="Receptionist">Receptionist</option>
								<option value="Housekeeping">Housekeeping</option>
								<option value="Maintenance">Maintenance</option>
								<option value="Chef">Chef</option>
								<option value="Security">Security</option>
								<option value="Other">Other</option>
							</select>
							<div id="staffRoleError"></div>
						</div>
						<div>
							<label>Country</label>
							<select id="staffCountry" required aria-describedby="staffCountryError">
								<option value="">Select Country</option>
								<option value="USA">USA</option>
								<option value="UK">UK</option>
								<option value="Canada">Canada</option>
								<option value="Australia">Australia</option>
								<option value="India">India</option>
								<option value="Pakistan">Pakistan</option>
								<option value="Germany">Germany</option>
								<option value="France">France</option>
								<option value="Other">Other</option>
							</select>
							<div id="staffCountryError"></div>
						</div>
						<div>
							<label>Email</label>
							<input type="email" id="staffEmail" required aria-describedby="staffEmailError" />
							<div id="staffEmailError"></div>
						</div>
						<div>
							<label>Phone</label>
							<input type="tel" id="staffPhone" required aria-describedby="staffPhoneError" />
							<div id="staffPhoneError"></div>
						</div>
					</div>
					<div>
						<button type="submit">Save</button>
						<button type="button" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
		</div>

		<!-- Loading Spinner and Toast Container -->
		<div id="loadingSpinner" style="display:none;"><div>Loading...</div></div>
		<div id="toastContainer"></div>

		<script src="js/storage-utils.js"></script>
		<script src="js/staff.js"></script>
		<script>
		// Client-side validation for staff form
		const staffForm = document.getElementById('staffForm');
		staffForm.onsubmit = function(e) {
			const name = document.getElementById('staffName').value.trim();
			const role = document.getElementById('staffRole').value;
			const email = document.getElementById('staffEmail').value.trim();
			const phone = document.getElementById('staffPhone').value.trim();
			const country = document.getElementById('staffCountry').value;
			let valid = true;
			let msg = '';
			if (!name) { valid = false; msg = 'Full name is required.'; }
			else if (!role) { valid = false; msg = 'Role is required.'; }
			else if (!country) { valid = false; msg = 'Country is required.'; }
			else if (!email || !/^\S+@\S+\.\S+$/.test(email)) { valid = false; msg = 'Valid email is required.'; }
			else if (!phone) { valid = false; msg = 'Phone is required.'; }
			if (!valid) {
				e.preventDefault();
				const toastContainer = document.getElementById('toastContainer');
				const toast = document.createElement('div');
				toast.innerHTML = '<div>' + msg + '</div>';
				toastContainer.appendChild(toast);
				setTimeout(() => toast.remove(), 4000);
				return false;
			}
		};
		</script>
	</body>
</html>
