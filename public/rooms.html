<!DOCTYPE html>
<html lang="en">
	<head>
		<!-- Meta and CSS includes -->
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Room Management - HotelAir</title>
		<link rel="icon" type="image/png" href="favicon.png" />
	</head>
	<body>
		<div>
			<!-- Sidebar Navigation -->
			<nav>
				<!-- Logo and Brand -->
				<div>
					<svg viewBox="0 0 32 32" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
						<defs>
							<linearGradient id="hotelair-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
								<stop stop-color="#1976d2" />
								<stop offset="1" stop-color="#00bcd4" />
							</linearGradient>
						</defs>
						<rect x="2" y="10" width="28" height="16" rx="4" fill="url(#hotelair-gradient)"/>
						<rect x="8" y="6" width="16" height="6" rx="2" fill="#fff" fill-opacity=".9"/>
						<circle cx="10" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
						<circle cx="22" cy="24" r="2" fill="#fff" fill-opacity=".8"/>
					</svg>
					HotelAir
				</div>
				<!-- Sidebar Links -->
				<ul>
					<li><a href="dashboard.html">Dashboard</a></li>
					<li><a href="rooms.html" class="active">Rooms</a></li>
					<li><a href="bookings.html">Bookings</a></li>
					<li><a href="calendar.html">Calendar</a></li>
					<li><a href="guests.html">Guests</a></li>
					<li><a href="staff.html">Staff</a></li>
					<li><a href="payments.html">Payments</a></li>
					<li><a href="settings.html">Settings</a></li>
					<li><a href="about.html">About Us</a></li>
				</ul>
			</nav>
			<div>
				<!-- Header Bar -->
				<header>
					<div>
						<span>Room Management</span>
						<div>
							<button id="darkModeToggle" title="Toggle dark mode"><i class="bi bi-moon-fill"></i></button>
							<button id="logoutBtn">Logout</button>
							<button id="addRoomBtn" data-bs-toggle="modal" data-bs-target="#roomModal">Add Room</button>
						</div>
					</div>
				</header>
				<main>
					<!-- Loading Spinner -->
					<div id="loadingSpinner" style="display:none;">
						<div>Loading...</div>
					</div>

					<!-- Toast Container for notifications -->
					<div id="toastContainer"></div>

					<!-- Rooms Table -->
					<div>
						<table id="roomsTable">
							<thead>
								<tr>
									<th>Room #</th>
									<th>Type</th>
									<th>Price</th>
									<th>Capacity</th>
									<th>Status</th>
									<th>Description</th>
									<th>Actions</th>
								</tr>
							</thead>
							<tbody></tbody>
						</table>
					</div>
				</main>
			</div>
		</div>

		<!-- Room Modal -->
		<div id="roomModal" tabindex="-1" aria-hidden="true">
			<div>
				<form id="roomForm">
					<div>
						<h5>Room Form</h5>
						<button type="button" data-bs-dismiss="modal">Close</button>
					</div>
					<div>
						<input type="hidden" id="roomId" />
						<div>
							<label>Room Number</label>
							<input type="text" id="roomNumber" required aria-describedby="roomNumberError" />
							<div id="roomNumberError"></div>
						</div>
						<div>
							<label>Room Type</label>
							<select id="roomType" required aria-describedby="roomTypeError"></select>
							<div id="roomTypeError"></div>
						</div>
						<div>
							<label>Price</label>
							<input type="number" id="roomPrice" required aria-describedby="roomPriceError" />
							<div id="roomPriceError"></div>
						</div>
						<div>
							<label>Capacity</label>
							<input type="number" id="roomCapacity" required aria-describedby="roomCapacityError" />
							<div id="roomCapacityError"></div>
						</div>
						<div>
							<label>Description</label>
							<textarea id="roomDesc" rows="2" aria-describedby="roomDescError"></textarea>
							<div id="roomDescError"></div>
						</div>
					</div>
					<div>
						<button type="submit">Save</button>
						<button type="button" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
		</div>

		<script src="js/storage-utils.js"></script>
		<script src="js/rooms.js"></script>
	</body>
</html>
